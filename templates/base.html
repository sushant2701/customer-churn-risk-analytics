<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Customer Churn Risk Analytics{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar Navigation -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-chart-line me-2"></i>Telecom Churn</h3>
            </div>

            <ul class="list-unstyled components">
                <li class="{% if request.path == '/' or request.path == '/dashboard' %}active{% endif %}">
                    <a href="{{ url_for('dashboard') }}">
                        <i class="fa-solid fa-gauge-high"></i>Dashboard
                    </a>
                </li>
                <li class="{% if request.path == '/etl' %}active{% endif %}">
                    <a href="{{ url_for('etl_page') }}">
                        <i class="fa-solid fa-database"></i>ETL Pipeline
                    </a>
                </li>
                <li class="{% if request.path == '/sql' %}active{% endif %}">
                    <a href="{{ url_for('sql_page') }}">
                        <i class="fa-solid fa-filter"></i>SQL Segments
                    </a>
                </li>
                <li class="{% if request.path == '/model' %}active{% endif %}">
                    <a href="{{ url_for('model_page') }}">
                        <i class="fa-solid fa-robot"></i>Churn Model
                    </a>
                </li>
            </ul>
            
            <div class="p-3 text-center text-muted border-top border-secondary mt-5" style="font-size: 0.8rem;">
                <p class="mb-0">Powered by Flask & Scikit-Learn</p>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div id="content">
            <!-- Top Navbar info -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <h4 class="fw-bold mb-0">{% block page_header %}Analytics Platform{% endblock %}</h4>
                <div class="text-end">
                    <span class="badge bg-secondary p-2"><i class="fa-solid fa-clock me-1"></i>Live Environment</span>
                </div>
            </div>

            <!-- Page Specific Content -->
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Application JS -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
